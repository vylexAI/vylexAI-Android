name: Deploy GlitchTip

# Manual only — updates the self-hosted GlitchTip stack on the Hetzner box.
# The box layout is FLAT under /opt/vylex/ and the SSH user is root.
# Requires secrets: DEPLOY_HOST, DEPLOY_USER (root), DEPLOY_SSH_KEY.
# The glitchtip.vylexai.com Caddy vhost is already in /opt/vylex/Caddyfile, and
# /opt/vylex/glitchtip/.env is created once on first deploy and then preserved
# (so the generated Postgres password is never rotated out from under the DB).
on:
  workflow_dispatch:

concurrency:
  group: deploy-glitchtip
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GlitchTip to Hetzner
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://glitchtip.vylexai.com
    steps:
      - uses: actions/checkout@v4

      - name: Rsync GlitchTip stack to host
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --exclude=.env
          path: backend/glitchtip/
          remote_path: /opt/vylex/glitchtip/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy via SSH (capacity-guarded)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GLITCHTIP_SECRET_KEY,GLITCHTIP_POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/vylex/glitchtip

            # First-deploy only: create .env from secrets. Never overwrite an
            # existing one (would rotate the Postgres password and break the DB).
            if [ ! -f .env ]; then
              umask 077
              cat > .env <<EOF
            GLITCHTIP_SECRET_KEY=${GLITCHTIP_SECRET_KEY}
            GLITCHTIP_POSTGRES_PASSWORD=${GLITCHTIP_POSTGRES_PASSWORD}
            GLITCHTIP_EMAIL_URL=consolemail://
            GLITCHTIP_OPEN_REGISTRATION=false
            EOF
            fi

            # Safety guard: refuse to (re)start if the box is low on RAM, so a
            # restart can never OOM the live Coordinator.
            AVAIL=$(free -m | awk '/^Mem:/{print $7}')
            echo "Available RAM: ${AVAIL} MB"
            if [ "${AVAIL:-0}" -lt 900 ]; then
              echo "ABORT: only ${AVAIL} MB RAM available (<900). Refusing to (re)start GlitchTip."
              exit 1
            fi

            docker compose --env-file .env -p glitchtip pull
            docker compose --env-file .env -p glitchtip up -d --remove-orphans
            docker image prune -f

      - name: Smoke check
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://glitchtip.vylexai.com/_health/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "GlitchTip did not return 200 from /_health/ in time"
          exit 1
