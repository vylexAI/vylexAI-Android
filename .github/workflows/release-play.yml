name: Release to Play

# Manual only — never auto-publishes. Build a signed AAB and push it to a
# Google Play track via gradle-play-publisher (Play Android Publisher API).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   PLAY_SERVICE_ACCOUNT_JSON   full JSON of the Play service-account key
#   VYLEX_KEYSTORE_BASE64       base64 of keystores/vylexai-release.jks
#   VYLEX_KEYSTORE_PASSWORD     keystore store password
#   VYLEX_KEYSTORE_KEY_ALIAS    signing key alias
#   VYLEX_KEYSTORE_KEY_PASSWORD signing key password
# Optional:
#   VYLEX_PLAY_INTEGRITY_PROJECT  Google Cloud project number for Play Integrity

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

concurrency:
  group: release-play
  cancel-in-progress: false

jobs:
  publish:
    name: build · sign · publish (${{ inputs.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets present
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VYLEX_KEYSTORE_BASE64: ${{ secrets.VYLEX_KEYSTORE_BASE64 }}
          VYLEX_KEYSTORE_PASSWORD: ${{ secrets.VYLEX_KEYSTORE_PASSWORD }}
          VYLEX_KEYSTORE_KEY_ALIAS: ${{ secrets.VYLEX_KEYSTORE_KEY_ALIAS }}
          VYLEX_KEYSTORE_KEY_PASSWORD: ${{ secrets.VYLEX_KEYSTORE_KEY_PASSWORD }}
        run: |
          missing=0
          for v in PLAY_SERVICE_ACCOUNT_JSON VYLEX_KEYSTORE_BASE64 VYLEX_KEYSTORE_PASSWORD VYLEX_KEYSTORE_KEY_ALIAS VYLEX_KEYSTORE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing required secret: $v"; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Set the secrets above, then re-run. See RELEASE-PLAY.md."; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize signing keystore
        env:
          VYLEX_KEYSTORE_BASE64: ${{ secrets.VYLEX_KEYSTORE_BASE64 }}
        run: |
          echo "$VYLEX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vylexai-release.jks"

      - name: Materialize Play service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Publish AAB to Play (${{ inputs.track }})
        env:
          VYLEX_KEYSTORE_PATH: ${{ runner.temp }}/vylexai-release.jks
          VYLEX_KEYSTORE_PASSWORD: ${{ secrets.VYLEX_KEYSTORE_PASSWORD }}
          VYLEX_KEYSTORE_KEY_ALIAS: ${{ secrets.VYLEX_KEYSTORE_KEY_ALIAS }}
          VYLEX_KEYSTORE_KEY_PASSWORD: ${{ secrets.VYLEX_KEYSTORE_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json
          VYLEX_PLAY_INTEGRITY_PROJECT: ${{ secrets.VYLEX_PLAY_INTEGRITY_PROJECT }}
        run: |
          ./gradlew --no-daemon :app:publishReleaseBundle --track "${{ inputs.track }}"

      - name: Cleanup secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/vylexai-release.jks" "$RUNNER_TEMP/play-service-account.json"
